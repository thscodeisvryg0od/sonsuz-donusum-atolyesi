<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sonsuz Dönüşüm Atölyesi</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/themes.css">
</head>
<body>
    <div id="canvas-container">
        <canvas id="artCanvas"></canvas>
    </div>

    <div class="ui-layer">
        <header>
            <h1>Sonsuz Dönüşüm Atölyesi</h1>
            <p>Bir kelime yaz veya bir tema seç, sanatı birlikte yaratalım.</p>
        </header>

        <main>
            <div class="input-section">
                <input type="text" id="userInput" placeholder="Bir kelime yaz..." autocomplete="off">
                <button id="themeBtn">Sanatçı Modunu Aç</button>
            </div>
            
            <div id="dynamicContent" class="content-box">
                <!-- Dinamik içerik buraya gelecek -->
                <p class="placeholder-text">Bekliyorum...</p>
            </div>
        </main>
    </div>

    <script src="js/utils.js"></script>
    <script src="js/content-generator.js"></script>
    <script src="js/ai-visualizer.js"></script>
    <script src="js/core.js"></script>
</body>
</html>
